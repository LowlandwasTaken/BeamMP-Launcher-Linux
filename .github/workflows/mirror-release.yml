name: Mirror Upstream Release and Build Click-and-Install

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-and-build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Fork
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          submodules: recursive
          fetch-depth: 0

      - name: Check Latest Upstream Release
        id: check_release
        run: |
          UPSTREAM_TAG=$(curl -s https://api.github.com/repos/BeamMP/BeamMP-Launcher/releases/latest | jq -r '.tag_name // empty')
          if [ -z "$UPSTREAM_TAG" ]; then
            echo "Failed to determine the latest upstream tag."
            exit 1
          fi

          echo "Latest upstream tag: $UPSTREAM_TAG"
          echo "TAG=$UPSTREAM_TAG" >> "$GITHUB_OUTPUT"

          if gh release view "$UPSTREAM_TAG" --repo "${{ github.repository }}" --json assets --jq '.assets[].name' >/tmp/release_assets.txt 2>/dev/null; then
            if grep -Eq 'BeamMP-Launcher-.*(x86_64\.AppImage|amd64\.deb)$' /tmp/release_assets.txt; then
              echo "RELEASE_EXISTS=true" >> "$GITHUB_OUTPUT"
              echo "Mirror assets already exist for $UPSTREAM_TAG. Skipping build."
            else
              echo "RELEASE_EXISTS=false" >> "$GITHUB_OUTPUT"
              echo "Release exists but is missing click-and-install assets. Building mirror assets for $UPSTREAM_TAG."
            fi
          else
            echo "RELEASE_EXISTS=false" >> "$GITHUB_OUTPUT"
            echo "No mirror release exists yet for $UPSTREAM_TAG. Building one."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Environment and Build
        if: steps.check_release.outputs.RELEASE_EXISTS == 'false'
        run: |
          TAG="${{ steps.check_release.outputs.TAG }}"
          CLEAN_VER="${TAG#v}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/BeamMP/BeamMP-Launcher.git || true
          git fetch upstream --tags
          git checkout "$TAG"

          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config curl zip unzip tar wget libfuse2 imagemagick

          if [ -z "$VCPKG_ROOT" ]; then
            export VCPKG_ROOT="/usr/local/share/vcpkg"
          fi

          cmake -S . -B bin \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=20 \
            -DCMAKE_CXX_STANDARD_REQUIRED=ON \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-linux

          cmake --build bin --config Release

          mkdir -p release_assets

          # 1. Build Universal AppImage (Click-and-run anywhere)
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          cp bin/BeamMP-Launcher AppDir/usr/bin/BeamMP-Launcher

          # Generate a fallback 256x256 icon so appimagetool validates successfully
          convert -size 256x256 xc:royalblue AppDir/usr/share/icons/hicolor/256x256/apps/beammp-launcher.png || true
          cp AppDir/usr/share/icons/hicolor/256x256/apps/beammp-launcher.png AppDir/.DirIcon || true

          cat << EOF > AppDir/BeamMP-Launcher.desktop
          [Desktop Entry]
          Name=BeamMP Launcher
          Exec=BeamMP-Launcher
          Icon=beammp-launcher
          Type=Application
          Categories=Game;
          EOF

          cp AppDir/BeamMP-Launcher.desktop AppDir/beammp-launcher.desktop

          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ./appimagetool-x86_64.AppImage --appimage-extract
          ./squashfs-root/AppRun AppDir release_assets/BeamMP-Launcher-$TAG-x86_64.AppImage --no-appstream

          # 2. Build .deb Package (1-click graphical install for Ubuntu/Debian/Mint)
          mkdir -p deb_package/DEBIAN
          mkdir -p deb_package/usr/bin
          cp bin/BeamMP-Launcher deb_package/usr/bin/beammp-launcher

          cat << EOF > deb_package/DEBIAN/control
          Package: beammp-launcher
          Version: $CLEAN_VER
          Section: games
          Priority: optional
          Architecture: amd64
          Maintainer: Automated Mirror <noreply@github.com>
          Description: Official launcher for BeamMP (Multiplayer mod for BeamNG.drive)
          EOF

          dpkg-deb --build deb_package release_assets/BeamMP-Launcher-$TAG-amd64.deb

      - name: Publish Click-and-Install Release
        if: steps.check_release.outputs.RELEASE_EXISTS == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.check_release.outputs.TAG }}
        run: |
          RELEASE_JSON=$(curl -s "https://api.github.com/repos/BeamMP/BeamMP-Launcher/releases/tags/$TAG")
          TITLE=$(echo "$RELEASE_JSON" | jq -r '.name')
          BODY=$(echo "$RELEASE_JSON" | jq -r '.body')

          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" release_assets/*.AppImage release_assets/*.deb --repo "${{ github.repository }}" --clobber
          else
            gh release create "$TAG" \
              --repo "${{ github.repository }}" \
              --title "$TITLE" \
              --notes "$BODY" \
              release_assets/*.AppImage \
              release_assets/*.deb
          fi

name: Mirror Upstream Release and Build Linux

on:
  schedule:
    - cron: '0 */6 * * *' # Checks every 6 hours for a new upstream release
  workflow_dispatch: # Allows manual trigger from the Actions tab

permissions:
  contents: write

jobs:
  check-and-build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Fork
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          submodules: recursive
          fetch-depth: 0

      - name: Check Latest Upstream Release
        id: check_release
        run: |
          UPSTREAM_TAG=$(curl -s https://api.github.com/repos/BeamMP/BeamMP-Launcher/releases/latest | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/')
          echo "Latest upstream tag: $UPSTREAM_TAG"
          
          if gh release view "$UPSTREAM_TAG" --repo ${{ github.repository }} &>/dev/null; then
            echo "RELEASE_EXISTS=true" >> $GITHUB_OUTPUT
            echo "Release $UPSTREAM_TAG already exists. Skipping."
          else
            echo "RELEASE_EXISTS=false" >> $GITHUB_OUTPUT
            echo "New release found: $UPSTREAM_TAG"
            echo "TAG=$UPSTREAM_TAG" >> $GITHUB_OUTPUT
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Environment and Build Linux Binary
        if: steps.check_release.outputs.RELEASE_EXISTS == 'false'
        run: |
          TAG="${{ steps.check_release.outputs.TAG }}"
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git remote add upstream https://github.com/BeamMP/BeamMP-Launcher.git || true
          git fetch upstream --tags
          git checkout "$TAG"

          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config curl zip unzip tar

          if [ -z "$VCPKG_ROOT" ]; then
            export VCPKG_ROOT="/usr/local/share/vcpkg"
          fi

          cmake -S . -B bin \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=20 \
            -DCMAKE_CXX_STANDARD_REQUIRED=ON \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-linux

          cmake --build bin --config Release

          # Package the Linux binary into a compressed tarball
          mkdir -p release_assets
          tar -czvf release_assets/BeamMP-Launcher-$TAG-Linux-x86_64.tar.gz -C bin BeamMP-Launcher

      - name: Publish Mirror Release
        if: steps.check_release.outputs.RELEASE_EXISTS == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.check_release.outputs.TAG }}
        run: |
          RELEASE_JSON=$(curl -s "https://api.github.com/repos/BeamMP/BeamMP-Launcher/releases/tags/$TAG")
          TITLE=$(echo "$RELEASE_JSON" | jq -r '.name')
          BODY=$(echo "$RELEASE_JSON" | jq -r '.body')

          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "$TITLE" \
            --notes "$BODY" \
            release_assets/BeamMP-Launcher-$TAG-Linux-x86_64.tar.gz

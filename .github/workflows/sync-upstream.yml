name: Sync Upstream Safely

on:
  schedule:
    - cron: '0 */12 * * *' # Runs automatically every 12 hours
  workflow_dispatch: # Allows manual trigger from the Actions tab

jobs:
  sync:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout Fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Perform Safe Upstream Merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git remote add upstream https://github.com/BeamMP/BeamMP-Launcher.git || true
          git fetch upstream
          
          BRANCH="master"
          if git show-ref --verify --quiet refs/remotes/origin/main; then
            BRANCH="main"
          fi
          
          git checkout $BRANCH
          git merge upstream/$BRANCH --no-edit || git merge upstream/main --no-edit || true
          
          # Protect local GitHub workflows from upstream changes
          git checkout HEAD -- .github/workflows/ 2>/dev/null || true
          git reset .github/workflows/ 2>/dev/null || true
          git clean -fd .github/workflows/ 2>/dev/null || true
          
          if git status --porcelain | grep -q .; then
            git commit -m "Auto-sync with upstream (protected workflows)" || true
            git push origin $BRANCH
          else
            echo "No upstream changes to sync."
          fi
